name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-lumen/package-lock.json

      - name: Show tool versions
        run: |
          node --version
          npm --version
          clang --version

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: npm run test:unit

      - name: Example tests
        id: examples
        continue-on-error: true
        run: npm run test:examples

      - name: Negative tests
        id: negative
        continue-on-error: true
        run: npm run test:negative

      - name: Compiler parity matrix
        id: parity
        continue-on-error: true
        run: npm run test:parity

      - name: Compiler boundary properties
        id: properties
        continue-on-error: true
        run: npm run test:properties

      - name: Package checks
        id: package_check
        continue-on-error: true
        run: npm run check:package

      - name: Install VS Code packaging tools
        id: vscode_tools
        continue-on-error: true
        run: npm ci --prefix vscode-lumen

      - name: Package VS Code extension
        id: vscode_package
        continue-on-error: true
        run: npm run package --prefix vscode-lumen

      - name: Sanitizer tests
        id: sanitizers
        continue-on-error: true
        run: npm run test:sanitizers

      - name: Fail when a check failed
        if: >-
          ${{
            always() && (
              steps.unit.outcome != 'success' ||
              steps.examples.outcome != 'success' ||
              steps.negative.outcome != 'success' ||
              steps.parity.outcome != 'success' ||
              steps.properties.outcome != 'success' ||
              steps.package_check.outcome != 'success' ||
              steps.vscode_tools.outcome != 'success' ||
              steps.vscode_package.outcome != 'success' ||
              steps.sanitizers.outcome != 'success'
            )
          }}
        run: exit 1

  bootstrap:
    name: bootstrap-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Three-stage bootstrap tests
        run: npm run test:bootstrap -- --real

      - name: Stage verified native compiler
        run: node ./scripts/stage-native-compiler.mjs

      - name: Exercise staged compiler artifact
        run: |
          mkdir -p build/native-artifact-clean/src build/native-artifact-clean/examples
          cp -R compiler build/native-artifact-clean/compiler
          cp -R src/runtime build/native-artifact-clean/src/runtime
          cp examples/basic.lm build/native-artifact-clean/examples/basic.lm
          cp photon.json lumen.json build/native-artifact-clean/
          cp native/${{ runner.os == 'Linux' && 'linux' || 'darwin' }}-${{ runner.arch == 'X64' && 'x64' || 'arm64' }}/lumen-compiler build/native-artifact-clean/lumen-compiler
          cd build/native-artifact-clean
          ./lumen-compiler emit compiler/main.lm artifact-compiler.ll
          ./lumen-compiler build examples/basic.lm artifact-basic "${LUMEN_CLANG:-clang}" src/runtime

      - name: Clean-install tests
        run: npm run test:package

      - name: Retain native compiler proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-compiler-proof-${{ runner.os }}-${{ runner.arch }}
          path: |
            native/*/lumen-compiler
            build/native-artifact-clean/artifact-compiler.ll
            build/native-artifact-clean/artifact-basic
          if-no-files-found: warn
