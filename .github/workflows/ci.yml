name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-lumen/package-lock.json

      - name: Show tool versions
        run: |
          node --version
          npm --version
          clang --version

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: npm run test:unit

      - name: Example tests
        id: examples
        continue-on-error: true
        run: npm run test:examples

      - name: Negative tests
        id: negative
        continue-on-error: true
        run: npm run test:negative

      - name: Three-stage bootstrap tests
        id: bootstrap
        continue-on-error: true
        run: npm run test:bootstrap -- --real

      - name: Package checks
        id: package_check
        continue-on-error: true
        run: npm run check:package

      - name: Install VS Code packaging tools
        id: vscode_tools
        continue-on-error: true
        run: npm ci --prefix vscode-lumen

      - name: Package VS Code extension
        id: vscode_package
        continue-on-error: true
        run: npm run package --prefix vscode-lumen

      - name: Sanitizer tests
        id: sanitizers
        continue-on-error: true
        run: npm run test:sanitizers

      - name: Clean-install tests
        id: clean_install
        continue-on-error: true
        run: npm run test:package

      - name: Fail when a check failed
        if: >-
          ${{
            always() && (
              steps.unit.outcome != 'success' ||
              steps.examples.outcome != 'success' ||
              steps.negative.outcome != 'success' ||
              steps.bootstrap.outcome != 'success' ||
              steps.package_check.outcome != 'success' ||
              steps.vscode_tools.outcome != 'success' ||
              steps.vscode_package.outcome != 'success' ||
              steps.sanitizers.outcome != 'success' ||
              steps.clean_install.outcome != 'success'
            )
          }}
        run: exit 1
