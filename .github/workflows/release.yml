name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-lumen/package-lock.json

      - name: Install extension packaging tools
        run: npm ci --prefix vscode-lumen

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Run publish checks
        run: npm run release:check

      - name: Build and verify artifacts
        run: npm run release:artifacts

      - name: Keep workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
