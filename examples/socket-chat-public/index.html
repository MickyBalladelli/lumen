<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lumen Chat</title>
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #15191f;
      }

      main {
        max-width: 720px;
        margin: 40px auto;
        padding: 0 20px;
      }

      h1 {
        font-size: 28px;
        margin: 0 0 16px;
      }

      #status {
        color: #4b5563;
        margin-bottom: 16px;
      }

      #messages {
        background: white;
        border: 1px solid #d9dee7;
        min-height: 280px;
        padding: 16px;
        overflow: auto;
      }

      .message {
        border-bottom: 1px solid #eef0f3;
        padding: 8px 0;
      }

      form {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      input {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid #c8ced8;
        font: inherit;
      }

      button {
        padding: 10px 16px;
        border: 0;
        background: #1f6feb;
        color: white;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lumen Chat</h1>
      <div id="status">Connecting...</div>
      <div id="messages"></div>
      <form id="form">
        <input id="text" autocomplete="off" placeholder="Say hello">
        <button>Send</button>
      </form>
    </main>

    <script type="module">
      const status = document.querySelector('#status')
      const messages = document.querySelector('#messages')
      const form = document.querySelector('#form')
      const text = document.querySelector('#text')

      async function connect() {
        await fetch('/socket.io/?EIO=4&transport=polling')
        status.textContent = 'Connected'
      }

      async function loadMessages() {
        const response = await fetch('/socket.io/messages')
        const data = await response.json()

        messages.innerHTML = ''
        for (const item of data) {
          const row = document.createElement('div')
          row.className = 'message'
          row.textContent = `${item.user}: ${item.message}`
          messages.append(row)
        }
      }

      form.addEventListener('submit', async event => {
        event.preventDefault()
        const message = text.value.trim()
        if (!message) return

        await fetch('/socket.io/emit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            user: 'browser',
            message
          })
        })

        text.value = ''
        await loadMessages()
      })

      await connect()
      await loadMessages()
      setInterval(loadMessages, 1000)
    </script>
  </body>
</html>
